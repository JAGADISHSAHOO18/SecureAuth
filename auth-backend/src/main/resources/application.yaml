spring:
  application:
    name: secure-auth-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization.write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
app:
  cors.front-end-url: ${FRONT_END_URL:http://localhost:5173}
  auth:
    frontend.success-redirect: ${FRONT_END_SUCCESS_REDIRECT:http://localhost:5173/oauth/success}
    frontend.failure-redirect: ${FRONT_END_FAILURE_REDIRECT:http://localhost:5173/oauth/failure}
    email-verification-required: ${AUTH_EMAIL_VERIFICATION_REQUIRED:false}
    password-reset-minutes: ${AUTH_PASSWORD_RESET_MINUTES:15}
    email-verification-minutes: ${AUTH_EMAIL_VERIFICATION_MINUTES:30}
    mail.enabled: ${MAIL_ENABLED:false}
    mail.from: ${MAIL_FROM:no-reply@secureauth.local}
  admin.email: ${APP_ADMIN_EMAIL:}
security.jwt:
  secret: ${JWT_SECRET:change-this-development-secret-to-a-random-value-at-least-64-characters-long-123456789}
  issuer: ${JWT_ISSUER:secure-auth-api}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:1209600}
  refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-http-only: true
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:lax}
  cookie-domain: ${JWT_COOKIE_DOMAIN:}
spring.mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties.mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
  properties.mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
logging.level:
  root: INFO
  com.substring: INFO
