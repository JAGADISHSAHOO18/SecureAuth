services:
  mysql:
    image: mysql:8.4
    container_name: secureauth-mysql
    environment:
      MYSQL_DATABASE: auth_app
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: secureauth-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./auth-backend
    container_name: secureauth-backend
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/auth_app?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      FRONT_END_URL: http://localhost:5173
      FRONT_END_SUCCESS_REDIRECT: http://localhost:5173/oauth/success
      FRONT_END_FAILURE_REDIRECT: http://localhost:5173/oauth/failure
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-of-at-least-64-characters-for-local-docker}
      JWT_COOKIE_SECURE: "false"
      JPA_DDL_AUTO: update
      MAIL_ENABLED: "true"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      AUTH_EMAIL_VERIFICATION_REQUIRED: "true"
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-local-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-local-github-client-secret}
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./auth-front
      args:
        VITE_API_BASE_URL: http://localhost:8082/api/v1
        VITE_BACKEND_BASE_URL: http://localhost:8082
    container_name: secureauth-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
